[package]
name = "bracketlab"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
petgraph = "0.7"
kurbo = "0.11"
rstar = "0.12"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
rand = "0.8"
resvg = "0.45"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
egui_extras = { version = "=0.31.1", features = ["image"] }
egui-phosphor = "=0.9.0"
ttf-parser = "0.25"
